[package]
name = "supervisor-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A minimal process supervisor (mini-systemd) for Unix"
license = "MIT"
repository = "https://github.com/akomyagin/supervisor-rs"

[[bin]]
name = "supervisor-rs"
path = "src/main.rs"

[dependencies]
# Config parsing (Этап 1). serde derives config structs; toml parses the file.
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# Low-level Unix syscalls (Этапы 3–4): kill/killpg, setsid, waitpid, signals.
# Этап 5 adds `user` for `Uid::current()` — the uid in the default state-file
# path. That is a feature of a dependency we already have, not a new crate.
# `nix` is the idiomatic safe wrapper over libc; features are enabled per-stage
# so `cargo check` stays fast and the dependency surface stays explicit.
nix = { version = "0.29", features = ["signal", "process", "user"] }

# Structured logging (all stages). `tracing` over ad-hoc println! so log output
# stays greppable once the monitor loop gets noisy.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# Integration tests (Этап 4+) spawn helper binaries that fork children;
# tempfile gives them scratch dirs / marker files without polluting the repo.
tempfile = "3"
