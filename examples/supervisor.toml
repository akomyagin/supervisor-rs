# Example supervisor-rs config. Run it with:
#
#   supervisor-rs run examples/supervisor.toml
#
# and inspect the result from another terminal with `supervisor-rs status`.
#
# Each [[process]] entry describes one supervised process. `command` is an argv
# array (no shell parsing). `restart` is one of: always | on-failure | never.
# The `name` is what `status` prints in its NAME column.
#
# Every process is started as the leader of its own process group, so shutting
# the supervisor down takes the whole tree of its descendants with it, not just
# the direct child.
#
# To reload this file without restarting the daemon, edit it and send SIGHUP:
#
#   kill -HUP $(pid of the running supervisor-rs)
#
# The daemon re-reads the file, diffs processes by `name` and applies only the
# difference — added processes are spawned, removed ones are stopped, changed
# ones are restarted, unchanged ones are left alone. It is all-or-nothing: a
# broken new config is rejected wholesale and nothing changes. Process names
# must be unique (the reload diffs by name).

[[process]]
name = "web"
command = ["/usr/bin/env", "sleep", "3600"]
restart = "on-failure"
# Seconds to wait after SIGTERM/SIGINT before the group is SIGKILLed. Default 5.
#
# The grace protects the *leader* only. Once the leader exits, whatever is left
# in its group is killed at once — so a wrapper that does not wait for its own
# children hands them no grace at all. In particular, prefer
#   ["/bin/sh", "-c", "exec myapp"]
# over ["/bin/sh", "-c", "myapp"]: without `exec` the shell is the leader, it
# dies instantly on SIGTERM, and myapp is SIGKILLed milliseconds later having
# never had a chance to shut down cleanly.
stop-grace-secs = 10

[[process]]
name = "worker"
command = ["/usr/bin/env", "sleep", "3600"]
# workdir = "/srv/worker"
# env = { RUST_LOG = "info" }
restart = "always"

# Optional active health check for this process: exec | tcp | http. Failing
# `failure-threshold` probes in a row forces a restart (TERM -> stop-grace-secs
# -> SIGKILL), even though the process is still alive. Uncomment to try it:
#
# [process.health-check]
# type = "tcp"
# port = 8080
# # host = "127.0.0.1"      # tcp/http only; must be an IP, no DNS lookup
# interval-secs = 10        # default 10
# timeout-secs = 5          # default 5
# failure-threshold = 3     # default 3
# start-period-secs = 0     # default 0; delay before the first probe

# Optional capture of this process's stdout/stderr into files with size-based
# rotation (Этап 9). Without this section stdio is inherited from the daemon,
# exactly as before. With it, the configured stream goes through a pipe into the
# supervisor and a dedicated OS thread appends it to the current file; once the
# file reaches `max-size-bytes` the current file is moved to `<path>.1`, the old
# `.1` to `.2`, …, and the oldest beyond `keep` is dropped. Rotation is
# continuous (checked on every write), fully internal — no signals, no external
# logrotate. At least one of stdout-path / stderr-path is required, the two must
# differ, and all log paths across all processes must be unique. Output survives
# the daemon's shutdown (unlike the state file and socket). Uncomment to try it:
#
# [process.log]
# stdout-path = "/var/log/worker.stdout.log"   # at least one of the two paths
# stderr-path = "/var/log/worker.stderr.log"   # separate files; both optional
# max-size-bytes = 10485760                     # default 10 MiB (10 * 1024 * 1024)
# keep = 5                                       # default 5; rotated .1 (newest) … .keep

# Optional per-process resource limits via setrlimit(2) (Этап 10). Applied in the
# pre_exec hook (soft = hard = value) and inherited by every descendant. Without
# privileges limits can only be *lowered*: a value above the supervisor's own
# hard limit fails the spawn (EPERM). At least one key is required. Uncomment to
# try it:
#
# [process.rlimit]
# nofile = 1024               # RLIMIT_NOFILE: max open file descriptors
# as-bytes = 536870912        # RLIMIT_AS: max virtual address space, bytes
# cpu-secs = 300              # RLIMIT_CPU: max CPU seconds (SIGXCPU at the limit)

# Optional cgroup v2 limits for this process's whole tree (Этап 10). The
# supervisor creates <cgroup-root>/<name>, writes cpu.max / memory.max, and after
# spawn writes the child's pid into cgroup.procs — the limit then covers every
# descendant. The cgroup is used ONLY for CPU/memory limits, never for teardown
# (killpg remains the sole stop mechanism). Requires a delegated, writable cgroup
# v2 subtree: the cgroup-root's ancestor must have enabled the cpu/memory
# controllers in its cgroup.subtree_control. The root defaults to
# /sys/fs/cgroup/supervisor-rs and is overridable with `run --cgroup-root <path>`.
# A setup failure fails the spawn of THIS process (no silent "no limits"), leaving
# its neighbours running. At least one key is required. Uncomment to try it:
#
# [process.cgroup]
# cpu-max-percent = 50        # cpu.max as % of one CPU (50 = half, 200 = two CPUs)
# memory-max-bytes = 268435456 # memory.max, bytes (256 MiB)
